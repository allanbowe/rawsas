name: Gatsby Build Validation

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild sharp
        # .npmrc sets ignore-scripts=true; sharp 0.32 needs its install script
        # to fetch the libvips prebuild, and `npm rebuild` inherits the setting.
        run: npm rebuild sharp --ignore-scripts=false

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Check code style
        run: npm run lint

      - name: Build site
        run: npm run build -- --prefix-paths

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
