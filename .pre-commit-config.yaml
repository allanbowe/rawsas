# Pre-commit hooks for rawsas.com.
#
# Install once per clone:
#   pip install pre-commit && pre-commit install
#
# The same gitleaks scan runs in CI (see .github/workflows/build_validation.yaml),
# so a missed local hook still fails the pull request.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
